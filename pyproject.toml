[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "log-sentinel"
version = "0.1.0"
description = "Detecção de brute force, password spraying e varredura em logs de SSH e nginx"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
log-sentinel = "log_sentinel.cli:main"

[tool.setuptools]
packages = ["log_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
